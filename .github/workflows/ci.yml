name: HydroBreach CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite & Geospatial Raster Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System GDAL & Geospatial Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/requirements.txt
          pip install -e backend/
          pip install --prefer-binary pytest pytest-asyncio pytest-cov rasterio reportlab pyshp shapely scipy numpy ruff mypy pyproj xgboost lightgbm catboost

      - name: Run Flake8 Linter
        run: |
          pip install flake8
          flake8 backend/floodlab/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests -v --cov=backend

  frontend-tests:
    name: Frontend Vitest & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite (5 Product Screens & Exports)
        working-directory: ./frontend
        run: npm test

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

